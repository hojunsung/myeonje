<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08070c">
<meta name="description" content="일주일 동안 다섯 사람을 만난다. 화면에 뜨는 호감도는 그가 추정한 값이다.">
<meta property="og:type" content="website">
<meta property="og:title" content="면제 — 일주일">
<meta property="og:description" content="일주일 동안 다섯 사람을 만난다. 화면에 뜨는 호감도는 그가 추정한 값이다.">
<title>면제 — 일주일</title>
<style>
  :root{--ink:#eeeaf5;--dim:#9b95ad;--heart:#e2607a;--gold:#d9a441;--accent:#7f6ddb;--hp:#c9524b;}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#08070c;color:var(--ink);
    font-family:"Pretendard","Malgun Gothic",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:12px}

  .vn{position:relative;width:min(97vw,168vh,1560px);aspect-ratio:16/9;
    border-radius:14px;overflow:hidden;background:#000;
    box-shadow:0 30px 90px #000a;cursor:pointer;user-select:none}
  .vn>svg.bg{position:absolute;inset:0;width:100%;height:100%}
  /* 배경 컨테이너 — 안의 svg·canvas가 화면을 정확히 채우게 한다 */
  #bg{position:absolute;inset:0;overflow:hidden}
  #bg>svg,#bg>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  .stand{position:absolute;right:5%;bottom:0;height:99%;
    opacity:0;transform:translateY(28px);
    transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.3,1)}
  .stand.in{opacity:1;transform:translateY(0)}
  .stand svg{height:100%;width:auto;display:block}

  /* 상단 바 */
  .hud{position:absolute;top:0;left:0;right:0;padding:24px 30px;
    display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
    pointer-events:none;z-index:6}
  .panel{background:#120f18e0;border:1px solid #ffffff30;border-radius:14px;
    backdrop-filter:blur(10px);box-shadow:0 10px 34px #0008}
  .when{padding:13px 22px;display:flex;flex-direction:column;gap:2px}
  .when b{font-size:24px;font-weight:800;letter-spacing:.02em}
  .when span{font-size:14px;color:#a49db8}

  .stats{padding:15px 20px 16px;display:flex;flex-direction:column;gap:11px;min-width:290px}
  .stats .money{font-size:25px;font-weight:800;color:var(--gold);text-align:right;
    font-variant-numeric:tabular-nums;line-height:1;margin-bottom:2px}
  .st{display:flex;align-items:center;gap:11px}
  .st .lb{font-size:14.5px;color:#d3cbe1;width:34px;font-weight:700}
  .st .rb{flex:1;height:13px;background:#00000080;border-radius:7px;overflow:hidden}
  .st .rb>i{display:block;height:100%;border-radius:7px;transition:width .45s}
  .st .vv{font-size:17px;font-weight:800;width:36px;text-align:right;
    font-variant-numeric:tabular-nums;color:#efeaf8}
  .st.low .vv,.st.low .lb{color:#e8756c}
  .stats.warn{border-color:#e8756c66;box-shadow:0 0 24px #e8756c22,0 10px 34px #0008}

  /* 호감도 */
  .aff{position:absolute;top:132px;left:30px;width:322px;
    background:#120f18d9;border:1px solid #ffffff2b;border-radius:14px;
    padding:15px 19px 17px;backdrop-filter:blur(9px);box-shadow:0 10px 34px #0007;
    opacity:0;transition:opacity .4s}
  .aff.on{opacity:1}
  .aff .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
  .aff .ttl{font-size:15px;color:#ded6ec;font-weight:600}
  .aff .num{font-size:26px;font-weight:800;color:var(--heart);text-shadow:0 0 20px #e2607a55}
  .aff .track{height:14px;background:#00000073;border-radius:8px;overflow:hidden}
  .aff .fill{height:100%;width:0%;border-radius:8px;
    background:linear-gradient(90deg,#a8455f,#e2607a 65%,#f39ab0);
    transition:width .75s cubic-bezier(.2,.9,.3,1)}
  .aff.done{border-color:#e2c05a66;box-shadow:0 0 30px #e2c05a26,0 10px 34px #0007}
  .aff.done .num{color:var(--gold);text-shadow:0 0 22px #d9a44166}
  .aff.done .fill{background:linear-gradient(90deg,#a8823a,#e2c05a 65%,#f7e2a4)}
  .aff.done .ttl::after{content:" · 확신";color:var(--gold);font-weight:800}
  .aff.pop{animation:pop .5s}
  @keyframes pop{0%,100%{transform:scale(1)}35%{transform:scale(1.055)}}

  .gain{position:absolute;left:366px;top:138px;font-size:32px;font-weight:800;
    text-shadow:0 2px 14px #000;opacity:0;pointer-events:none;white-space:nowrap}
  .gain.up{color:var(--heart)} .gain.down{color:#6fb3d8}
  .gain.go{animation:rise 1.6s ease-out}
  @keyframes rise{0%{opacity:0;transform:translateY(10px) scale(.85)}
    18%{opacity:1;transform:translateY(0) scale(1.12)}
    45%{opacity:1;transform:translateY(-6px) scale(1)}
    100%{opacity:0;transform:translateY(-34px) scale(1)}}
  .rgain{position:absolute;right:30px;top:172px;display:flex;flex-direction:column;
    align-items:flex-end;gap:6px;pointer-events:none}
  .rgain span{font-size:24px;font-weight:800;text-shadow:0 2px 12px #000;opacity:0;
    color:#e8756c;animation:rrise 1.8s ease-out}
  .rgain span.plus{color:#82c795}
  @keyframes rrise{0%{opacity:0;transform:translateX(14px)}
    20%{opacity:1;transform:translateX(0)}
    65%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}

  .reason{position:absolute;left:30px;top:236px;width:344px;font-size:17px;line-height:1.7;
    color:#f5c3ce;font-weight:500;text-shadow:0 2px 14px #000;opacity:0;transition:opacity .45s}
  .reason.show{opacity:1}

  /* 대사창 */
  .box{position:absolute;left:3%;right:3%;bottom:3.5%;
    background:linear-gradient(#15121eee,#0c0a12f7);
    border:1px solid #ffffff2b;border-radius:16px;
    padding:26px 36px 30px;min-height:28%;backdrop-filter:blur(11px);
    box-shadow:0 -8px 44px #0009}
  .box.hide{display:none}
  .name{position:absolute;top:-19px;left:30px;
    background:linear-gradient(#33294a,#1e1930);border:1px solid #ffffff33;
    border-radius:10px;padding:8px 24px;font-size:18px;font-weight:700;box-shadow:0 6px 20px #0008}
  .name.hidden{display:none}
  .line{font-size:23px;line-height:1.95;min-height:3.4em}
  .line.think{color:#c2bbd2;font-style:italic}
  .line.narr{color:#efeaf8}
  .line.say{color:#fff}
  .line.sys{color:var(--gold);font-weight:700}
  .next{position:absolute;right:32px;bottom:20px;font-size:15px;color:#a29ab5;animation:blink 1.5s infinite}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

  .choices{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:66%;display:none;flex-direction:column;gap:11px;max-height:78%;
    overflow-y:auto;overflow-x:hidden;z-index:20;
    scrollbar-width:none;-ms-overflow-style:none}
  .choices::-webkit-scrollbar{display:none}
  .choices.on{display:flex}
  .choices.final{top:60%}
  .choices button{background:#191524e8;color:var(--ink);border:1px solid #ffffff2e;
    border-radius:12px;padding:18px 24px;font:inherit;font-size:20px;text-align:left;
    cursor:pointer;backdrop-filter:blur(7px);transition:.16s;box-shadow:0 8px 26px #0007}
  .choices button:hover{border-color:var(--heart);background:#241a28ee;transform:translateX(5px)}
  .choices small{display:block;margin-top:5px;font-size:15px;color:#a49db8}
  .choices button.lock{opacity:.4;cursor:not-allowed;border-color:#ffffff18}
  .choices button.lock:hover{transform:none;border-color:#ffffff18;background:#191524e8}
  .choices button.ready{border-color:var(--heart);box-shadow:0 0 26px #e2607a33,0 8px 26px #0007}
  .choices button.ready small{color:var(--heart);font-weight:700}
  .cost{margin-top:9px;display:block}
  .cost i{display:inline-block;font-style:normal;margin-right:7px;padding:3px 11px;
    border-radius:20px;font-size:14px;font-weight:700;
    background:#2e2434;color:#e39b92;border:1px solid #56394a}
  .cost i.plus{background:#22332a;color:#82c795;border-color:#33513e}
  .choices button.poor{opacity:.4;cursor:not-allowed}
  .choices button.poor:hover{transform:none;border-color:#ffffff2e;background:#191524e8}

  /* 중얼거릴 때마다 세상이 조금씩 탁해진다 */
  .vn[data-오염="1"] #bg{filter:saturate(.82) contrast(1.05)}
  .vn[data-오염="2"] #bg{filter:saturate(.55) contrast(1.14) hue-rotate(-8deg)}
  .vn[data-오염="3"] #bg{filter:saturate(.28) contrast(1.24) hue-rotate(-15deg) brightness(.88)}
  /* 캔버스 미니게임 중에는 본편 HUD를 감춘다 */
  .vn.미니 .hud, .vn.미니 .aff, .vn.미니 .gain,
  .vn.미니 .rgain, .vn.미니 .reason, .vn.미니 .stand{display:none !important}

  /* 베손 찾기 */
  .shell{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);
    width:min(74%,660px);height:38%;display:none;z-index:6}
  .shell.on{display:block}
  .spot{position:absolute;bottom:0;width:29%;height:100%;
    transition:left .28s cubic-bezier(.4,0,.3,1);cursor:pointer}
  .spot svg{width:100%;height:100%;display:block;
    filter:drop-shadow(0 10px 18px #000a);transition:transform .18s,filter .18s}
  .spot:hover svg{transform:translateY(-7px);filter:drop-shadow(0 14px 22px #000c)}
  .shell.잠금 .spot{pointer-events:none}
  .shell.잠금 .spot:hover svg{transform:none}
  .spot .머리{opacity:0;transform:translateY(22px);transition:opacity .3s,transform .4s}
  .spot.열림 .머리{opacity:1;transform:translateY(0)}
  .spot .뚜껑{transform-origin:20px 66px;transition:transform .4s}
  .spot.열림 .뚜껑{transform:rotate(-28deg) translateY(-3px)}
  .spot.열림 svg{filter:drop-shadow(0 0 26px #e2c05a70) drop-shadow(0 10px 18px #000a)}
  .spot.열림:hover svg{transform:none}
  .shellhud{position:absolute;left:50%;top:22%;transform:translateX(-50%);
    background:#120f18e0;border:1px solid #ffffff30;border-radius:12px;
    padding:11px 22px;backdrop-filter:blur(9px);text-align:center;
    display:none;z-index:7;white-space:nowrap}
  .shellhud.on{display:block}
  .shellhud b{font-size:19px;font-weight:800;letter-spacing:.02em}
  .shellhud small{display:block;margin-top:4px;font-size:14px;color:#8b849b}

  /* 최종 미니게임 직전 연출 */
  .finale{position:absolute;inset:0;z-index:30;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:0;
    background:#05050ae8;opacity:0;transition:opacity .45s}
  .finale.on{display:flex;opacity:1}
  .finale .who{font-size:16px;letter-spacing:.34em;color:#8b849b;margin-bottom:22px;
    opacity:0;transform:translateY(8px)}
  .finale .who.보임{animation:떠오름 .6s forwards}
  .finale .lab{font-size:12px;letter-spacing:.42em;color:#6f6880;margin-bottom:10px;
    opacity:0;transform:translateY(6px)}
  .finale .lab.보임{animation:떠오름 .5s forwards}
  .finale .track{width:min(46%,420px);height:18px;background:#00000080;
    border:1px solid #ffffff26;border-radius:10px;overflow:hidden;opacity:0;
    transition:border-color .35s,box-shadow .35s}
  .finale .track.보임{animation:떠오름 .5s forwards}
  .finale .track.가득{border-color:#ffe9a8aa;box-shadow:0 0 34px #e2c05a66}
  .finale .fill{height:100%;width:0;border-radius:10px;
    background:linear-gradient(90deg,#8a6a2e,#e2c05a 60%,#fff0c0);
    box-shadow:0 0 26px #e2c05a88}
  .finale .fill.가득{background:linear-gradient(90deg,#e2c05a,#fff6d8 55%,#ffffff);
    box-shadow:0 0 44px #ffe9a8;animation:섬광 .6s}
  .finale .pct{margin-top:16px;font-size:44px;font-weight:800;color:#e2c05a;
    text-shadow:0 0 34px #e2c05a55;font-variant-numeric:tabular-nums;opacity:0;
    transition:font-size .32s cubic-bezier(.2,1.5,.4,1),color .32s,text-shadow .32s}
  .finale .pct.보임{animation:떠오름 .4s forwards}
  .finale .pct.가득{font-size:66px;color:#fff4d4;text-shadow:0 0 52px #ffd76e,0 0 14px #fff8e0;
    opacity:1;transform:none;animation:쿵 .62s}
  @keyframes 쿵{0%{transform:scale(1)}26%{transform:scale(1.26)}55%{transform:scale(.97)}100%{transform:scale(1)}}
  @keyframes 섬광{0%{filter:brightness(2.6)}100%{filter:brightness(1)}}
  .finale .say{margin-top:26px;font-size:22px;color:#efeaf8;font-style:italic;
    opacity:0;text-align:center;padding:0 30px}
  .finale .say.보임{animation:떠오름 .7s forwards}
  .finale .once{margin-top:16px;font-size:15px;letter-spacing:.24em;color:#e2607a;
    opacity:0}
  .finale .once.보임{animation:맥박 1.4s forwards}
  @keyframes 떠오름{to{opacity:1;transform:translateY(0)}}
  @keyframes 맥박{0%{opacity:0}25%{opacity:1}45%{opacity:.45}65%{opacity:1}100%{opacity:.9}}

  /* 타이핑 (소개팅 최종 미니게임) */
  .typing{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
    width:min(68%,620px);background:#120f18f0;border:1px solid #ffffff33;border-radius:16px;
    padding:26px 30px 28px;backdrop-filter:blur(11px);box-shadow:0 14px 44px #000b;
    display:none;z-index:14;text-align:center}
  .typing.on{display:block}
  .typing .said{font-size:27px;font-weight:800;color:#f6eefc;margin-bottom:6px}
  .typing .hint{font-size:15px;color:#8b849b;margin-bottom:20px}
  .typing .hint b{color:#e2607a}
  .typing input{width:100%;padding:15px 18px;font:inherit;font-size:25px;font-weight:700;
    text-align:center;background:#0b0a12;border:2px solid #3a3548;border-radius:10px;
    color:#f6eefc;outline:none;letter-spacing:.06em}
  .typing input:focus{border-color:#e2607a}
  .typing.틀림 input{border-color:#e8756c;animation:흔들 .3s}
  @keyframes 흔들{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .typing .bar{margin-top:18px;height:10px;background:#00000073;border-radius:6px;overflow:hidden}
  .typing .bar>i{display:block;height:100%;background:#e2607a;border-radius:6px}
  .typing .left{margin-top:9px;font-size:14px;color:#8b849b;font-variant-numeric:tabular-nums}

  /* 기다리기 미니게임 게이지 */
  .waitbar{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
    width:min(52%,460px);background:#120f18e0;border:1px solid #ffffff30;border-radius:14px;
    padding:16px 22px 18px;backdrop-filter:blur(10px);box-shadow:0 10px 34px #0008;
    display:none;z-index:6}
  .waitbar.on{display:block}
  .waitbar .wtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
  .waitbar .wl{font-size:15px;color:#ded6ec;font-weight:600;letter-spacing:.02em}
  .waitbar .wv{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
  .waitbar .wtrack{height:13px;background:#00000073;border-radius:7px;overflow:hidden}
  .waitbar .wfill{height:100%;width:0%;border-radius:7px;transition:width .35s,background .6s}
  .waitbar .wnote{margin-top:9px;font-size:13px;color:#6f6982;text-align:right}

  .taint{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.6s;z-index:3;
    background:radial-gradient(circle at 50% 44%, transparent 26%, #2a0912 100%)}
  .taint.on1{opacity:.30} .taint.on2{opacity:.55} .taint.on3{opacity:.8}
  .taint.on2,.taint.on3{animation:숨 7s ease-in-out infinite}
  @keyframes 숨{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  .veil{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .7s;z-index:10}
  .veil.on{opacity:1;pointer-events:auto}
  .card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;text-align:center;padding:40px;color:#fff}
  .card b{font-size:44px;font-weight:800}
  .card .sub{font-size:19px;color:#a49db8;line-height:2;max-width:760px}

  /* 하루 정산 */
  .day{display:flex;flex-direction:column;align-items:center;line-height:1.5}
  .day .last{font-size:13px;letter-spacing:.34em;font-weight:800;color:#e2607a;
    padding:5px 14px;border:1px solid #6b2f3c;border-radius:3px;margin-bottom:20px}
  .day .body{font-size:15px;color:#7db98d;letter-spacing:.03em}
  .day .rule{width:44px;height:1px;background:#3a3548;margin:20px 0}
  .day .leadin{font-size:12px;letter-spacing:.26em;color:#6f6982}
  .day .rate{font-size:38px;font-weight:800;color:#c9a8a4;margin-top:4px;
    font-variant-numeric:tabular-nums;line-height:1.1}
  .day .note{font-size:13px;color:#635e78;margin-top:5px}
  .day .rows{margin-top:18px;display:grid;grid-template-columns:auto 60px 46px;
    gap:9px 20px;font-size:15px;align-items:baseline}
  .day .rows .n{color:#8b849b;text-align:left}
  .day .rows .v{color:#e2dcf0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .day .rows .d{color:#8a6a67;text-align:right;font-variant-numeric:tabular-nums}
  .day .skip{font-size:17px;color:#8b849b}
  .day .skip small{display:block;font-size:14px;color:#635e78;margin-top:9px}
  .endtag{display:flex;align-items:center;gap:16px;
    font-size:16px;letter-spacing:.42em;font-weight:800;margin-bottom:4px}
  .endtag::before,.endtag::after{content:"";height:1px;width:54px}
  .endtag.happy{color:#f0b45e}
  .endtag.happy::before,.endtag.happy::after{background:#7a5c2e}
  .endtag.bad{color:#7f8aa3}
  .endtag.bad::before,.endtag.bad::after{background:#3a4152}
  .endno{letter-spacing:.1em;font-weight:700;opacity:.62;font-size:14px}
  .새엔딩{margin-left:12px;font-size:11px;letter-spacing:.2em;color:#0d0b12;
    background:#f0b45e;padding:3px 8px;border-radius:3px;vertical-align:middle}

  /* 타이틀 */
  .title{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;
    align-items:center;justify-content:center;padding:36px 24px;overflow-y:auto;
    background:radial-gradient(ellipse at 50% 32%,#181322 0%,#08070c 68%)}
  .title.on{display:flex}
  .title h1{margin:0;font-size:clamp(38px,7vw,62px);font-weight:900;letter-spacing:.06em;
    background:linear-gradient(180deg,#fff 20%,#b9a8d8 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .title .week{margin-top:6px;font-size:15px;letter-spacing:.52em;color:#7f6ddb;font-weight:700}
  .title .line{width:min(84%,440px);height:1px;margin:26px 0;
    background:linear-gradient(90deg,transparent,#6b5f8c 30%,#6b5f8c 70%,transparent)}
  .title .pitch{font-size:16px;line-height:2;color:#a49db8;text-align:center;max-width:520px}
  .title .pitch b{color:#e2607a;font-weight:700}
  .title .go{margin-top:30px;padding:16px 54px;font-size:20px;font-weight:800;letter-spacing:.1em;
    border-radius:11px;cursor:pointer;color:#0d0b12;border:none;
    background:linear-gradient(180deg,#f5d089,#d9a441);box-shadow:0 8px 26px #d9a44140}
  .title .go:hover{filter:brightness(1.08)}
  .title .keys{margin-top:20px;font-size:13px;color:#635e78;letter-spacing:.04em;text-align:center}
  .title .keys b{color:#8b849b;font-weight:600}

  /* 엔딩 수집 */
  .coll{margin-top:34px;width:100%;max-width:560px}
  .coll .head{display:flex;align-items:baseline;justify-content:center;gap:10px;
    font-size:12px;letter-spacing:.3em;color:#6f6982;margin-bottom:14px}
  .coll .head b{font-size:17px;letter-spacing:.06em;color:#f0b45e;font-variant-numeric:tabular-nums}
  .coll .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:7px}
  .coll .cell{border:1px solid #26222f;border-radius:6px;padding:8px 6px;text-align:center;
    font-size:11px;color:#4a4557;background:#0e0c14;line-height:1.6}

const 직전씬 = new WeakMap();
function 뽑기(풀) {

}

/* 슬롯 사이 랜덤 이벤트 */
/* ── 미니게임 ──
   규격: MINI.이름.시작(완료콜백) 으로 화면을 점유했다가,
        결과를 자원에 반영하고 마무리 장면을 재생한 뒤 콜백으로 돌아온다. */
const MINI = {};

/* 기다리기 — 준하가 전화를 받으러 사라졌다.
   누를 때마다 조금씩 닳는다. 그리고 아주 낮은 확률로, 정말 돌아온다. */
MINI.기다리기 = (() => {
  const 최대 = 12, 복귀확률 = 0.04;
  let n, 분, 쓴체력, 콜백;

  const 풍경 = [
    "그는 골목 모서리에 서 있다. 이쪽을 보지 않는다.",
    "통화는 아직 끝나지 않았다. 고개를 숙이고 있다.",
    "발끝으로 바닥을 툭툭 치고 있다. 길어지는 모양이다.",
    "해가 조금 기울었다. 그는 같은 자리에 있다.",
    "무슨 말을 하는지는 들리지 않는다. 목소리만 이어진다.",
    "가게 간판에 불이 들어왔다.",
    "이제 그가 거기 있는지도 잘 보이지 않는다."
  ];

  function 시작(cb) {
    콜백 = cb; n = 0; 분 = 0; 쓴체력 = 0;
    $("waitbar").classList.add("on");
    그리기();
  }

  /* 얼마나 서 있었는지 보여준다. 끝에 가까워질수록 붉어진다. */
  function 게이지() {
    const p = n / 최대;
    $("wv").textContent = 분 + "분";
    $("wv").style.color = p < .5 ? "#ded6ec" : p < .84 ? "#e2c05a" : "#e8756c";
    const f = $("wfill");
    f.style.width = (p * 100) + "%";
    f.style.background = p < .5
      ? "linear-gradient(90deg,#4e4770,#8b78e6)"
      : p < .84 ? "linear-gradient(90deg,#8b6a3a,#e2c05a)"
                : "linear-gradient(90deg,#8a3a34,#e8756c)";
    $("wnote").textContent = 쓴체력 ? `지금까지 체력 −${쓴체력}` : "";
  }

  function 그리기() {
    $("box").classList.remove("hide");
    $("name").className = "name hidden";
    $("line").className = "line narr";
    $("line").textContent = 풍경[Math.min(Math.floor(n / 2), 풍경.length - 1)];
    $("next").style.display = "none";
    게이지();
    const 다음소모 = 2 + Math.floor(n / 4);      // 길어질수록 한 번이 더 비싸진다
    const c = $("choices"); c.className = "choices on";
    c.innerHTML =
      `<button onclick="MINI.기다리기.누름()">계속 기다린다 <span style="color:#8b849b;font-weight:400">(5분)</span>` +
        `<small><span style="color:#e2c05a">낮은 확률로 그가 돌아온다</span>` +
        `${분 ? ` · 지금까지 ${분}분` : ""}</small>` +
        비용뱃지({ 체력: -다음소모, 정신: -1 }) + `</button>` +
      `<button onclick="MINI.기다리기.간다()">${n === 0 ? "그냥 간다" : "그만 간다"}` +
        `<small>기다린 시간은 돌아오지 않는다</small></button>`;
  }

  function 누름() {
    event.stopPropagation();
    const 소모 = 2 + Math.floor(n / 4);          // 길어질수록 더 닳는다
    쓴체력 += 소모; n++; 분 += 5;
    자원({ 체력: -소모, 정신: -1 });

    if (Math.random() < 복귀확률) return 돌아옴();
    if (n >= 최대) return 안옴();
    그리기();
  }

  function 간다() { event.stopPropagation(); 포기(); }

  function 마무리(지문) {
    $("choices").className = "choices";
    $("waitbar").classList.remove("on");
    $("next").style.display = "";
    대기 = 콜백;
    씬재생({ bg: "street", 인물: null, 대상: null, 지문 });
  }

  function 돌아옴() {
    자원({ 정신: 26 });
    자원팝업({ 정신: 26 });
    마무리([
      ["narr", `${분}분 만에, 골목에서 준하가 걸어나왔다.`],
      ["say", "준하: \"미안. 오래 걸렸네.\""],
      ["say", "준하: \"야, 밥 먹었냐?\""],
      ["narr", "그게 전부였다. 그런데 그 말이 이상하게 오래 남았다."],
      ["sys", "정신력이 크게 돌아왔다. (+26)"]
    ]);
  }

  function 안옴() {
    자원({ 정신: -7 });
    마무리([
      ["narr", "한 시간이 지났다."],
      ["narr", "골목에는 아무도 없었다. 언제 갔는지 모르겠다."],
      ["think", "누군가에게 소환당하는 놈과, 아무에게도 소환당하지 않는 나."]
    ]);
  }

  function 포기() {
    마무리(n === 0
      ? [["narr", "나는 그냥 걸었다."], ["think", "기다릴 이유가 없다. 나는 기다리는 쪽이 아니다."]]
      : n < 5
        ? [["narr", `${분}분쯤 서 있다가 돌아섰다.`], ["think", "바쁜 놈이니까."]]
        : [["narr", `${분}분을 서 있었다. 그리고 돌아섰다.`],
           ["think", "…바쁜 놈이니까."],
           ["narr", "그렇게 생각하려고 했다."]]);
  }

  return { 시작, 누름, 간다 };
})();

/* 개발용 — 주소 끝에 #이벤트id 를 붙이면 그 이벤트가 처음 한 번 강제로 뜬다.
   예) week.html#준하_전화   week.html#손날좌_불쾌 */
let 강제이벤트 = decodeURIComponent((location.hash || "").slice(1)) || null;

/* 캔버스 미니게임이 화면을 독점하는 동안 본편 HUD를 감춘다 */
const 미니화면 = on => $("vn").classList.toggle("미니", on);

/* ── 타이핑 (소개팅 최종 미니게임) ──
   그녀가 먼저 말한다. 제한 시간 안에 답을 쳐야 한다. */
const 타이핑설정 = {
  대사: "나 너 좋아해",
  답: "사귀자",
  제한: 4200        // ms
};

MINI.타이핑 = (() => {
  let 콜백, 시작시각, raf, 끝남;

  function 시작(cb) {
    콜백 = cb; 끝남 = false;
    $("box").classList.add("hide");
    $("choices").className = "choices";
    $("typing").className = "typing on";
    $("tySaid").textContent = `"${타이핑설정.대사}"`;
    $("tyHint").innerHTML = `<b>${타이핑설정.답}</b> 라고 친다`;
    const inp = $("tyInput");
    inp.value = ""; inp.disabled = false;
    inp.oninput = 확인;
    inp.onkeydown = e => { e.stopPropagation(); if (e.key === "Enter") 확인(); };
    inp.onpointerdown = e => e.stopPropagation();
    setTimeout(() => inp.focus(), 60);
    시작시각 = performance.now();
    루프();
  }

  function 확인() {
    if (끝남) return;
    const v = $("tyInput").value.replace(/\s/g, "");
    if (v === 타이핑설정.답) return 끝(true);
    if (v.length >= 타이핑설정.답.length && !타이핑설정.답.startsWith(v.slice(0, 1))) {
      $("typing").className = "typing on 틀림";
      setTimeout(() => { if (!끝남) $("typing").className = "typing on"; }, 300);
    }
  }

  function 루프() {
    if (끝남) return;
    const 남 = Math.max(0, 타이핑설정.제한 - (performance.now() - 시작시각));
    $("tyBar").style.width = (남 / 타이핑설정.제한 * 100) + "%";
    $("tyLeft").textContent = (남 / 1000).toFixed(1) + "초";
    if (남 <= 0) return 끝(false);
    raf = requestAnimationFrame(루프);
  }

  function 끝(성공) {
    끝남 = true; cancelAnimationFrame(raf);
    const inp = $("tyInput");
    inp.disabled = true; inp.oninput = null; inp.onkeydown = null; inp.blur();
    $("typing").className = "typing";
    setTimeout(() => 콜백(성공), 450);
  }

  return { 시작 };
})();

/* ── 훔쳐보기 (엘리베이터의 그녀 · 최종 미니게임) ──
   계단을 따라 내려간다. 그녀가 휴대폰을 옆으로 내미는 순간에만 화면이 보인다.
   5번 중 3번 잡으면 통과. */
const 훔쳐설정 = {
  판수: 5, 필요: 5,   // 한 번이라도 놓치면 그 자리에서 끝난다
  제한: 1900,        // 한 판에 주어지는 시간(ms)
  // 판마다 값이 달라진다. 보이는 쪽(좌/우)도 매번 바뀐다.
  문턱: 0.58, 문턱증가: 0.068, 문턱흔들: 0.09,   // 팔이 이만큼 넘게 나가야 보인다
  속도: 0.046, 속도증가: 0.010, 속도흔들: 0.34
};

MINI.훔쳐보기 = (() => {
  let G, raf, 콜백, 키;

  function 시작(cb) {
    콜백 = cb;
    미니화면(true);
    $("box").classList.add("hide");
    $("choices").className = "choices";
    $("bg").innerHTML = `<canvas id="cv" width="1280" height="640"></canvas>`;
    G = { 상태:"대기", 판:0, 성공:0, t:0, 위상:Math.random()*6, 판시작:0, 결과:null, 로그:[] };
    입력(true);
    $("shellhud").className = "shellhud on";
    $("shellhud").innerHTML = `<b>계단</b>` +
      `<small>그녀가 휴대폰을 옆으로 내미는 순간에만 보인다.<br>` +
      `<span style="color:#e8756c">한 번이라도 놓치면 끝난다</span> ` +
      `<span style="color:#e2c05a">${훔쳐설정.판수}번 연속</span></small>`;
    $("choices").className = "choices on";
    $("choices").innerHTML = `<button onclick="MINI.훔쳐보기.개시()">한 계단 뒤에서 따라간다</button>`;
    그리기();
  }

  function 개시() {
    if (event) event.stopPropagation();
    $("shellhud").className = "shellhud";
    $("choices").className = "choices";
    G.상태 = "진행"; 새판();
    루프();
  }

  function 새판() {
    G.판시작 = performance.now(); G.결과 = null;
    G.위상 = Math.random() * 6;
    G.방향 = Math.random() < .5 ? -1 : 1;          // 이번 판에 화면이 보이는 쪽
    const 흔1 = (Math.random() - .5) * 2 * 훔쳐설정.문턱흔들;
    const 흔2 = (Math.random() - .5) * 2 * 훔쳐설정.속도흔들;
    G.문턱 = Math.min(.80, Math.max(.30,
      훔쳐설정.문턱 + G.판 * 훔쳐설정.문턱증가 + 흔1));
    G.속도 = (훔쳐설정.속도 + G.판 * 훔쳐설정.속도증가) * (1 + 흔2);
  }

  const 문턱 = () => G.문턱 ?? 훔쳐설정.문턱;
  const 속도 = () => G.속도 ?? 훔쳐설정.속도;
  const 값   = () => Math.sin(G.t * 속도() + G.위상);        // -1 왼쪽 … +1 오른쪽
  const 노출 = () => 값() * (G.방향 || 1);                    // 보이는 쪽으로 얼마나 나갔나

  function 본다() {
    if (G.상태 !== "진행" || G.결과) return;
    const 보임 = 노출() > 문턱();
    G.결과 = 보임 ? "봤다" : "못 봤다";
    if (보임) G.성공++;
    G.로그.push(G.결과);
    setTimeout(보임 ? 다음판 : 끝, 900);   // 한 번 놓치면 거기서 끝
  }

  function 다음판() {
    G.판++;
    if (G.판 >= 훔쳐설정.판수) return 끝();
    새판();
  }

  function 입력(on) {
    if (on) {
      키 = e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); 본다(); } };
      addEventListener("keydown", 키);
      $("bg").onpointerdown = e => { e.stopPropagation(); 본다(); };
    } else { removeEventListener("keydown", 키); $("bg").onpointerdown = null; }
  }

  function 루프() {
    if (G.상태 !== "진행") return;
    G.t++;
    if (!G.결과 && performance.now() - G.판시작 > 훔쳐설정.제한) {
      G.결과 = "놓쳤다"; G.로그.push(G.결과); setTimeout(끝, 900);
    }
    그리기();
    raf = requestAnimationFrame(루프);
  }

  function 그리기() {
    const cv = $("cv"); if (!cv) return;
    const x = cv.getContext("2d"), w = 640, h = 320;
    x.setTransform(2, 0, 0, 2, 0, 0);
    const p = 값(), v = 노출(), 문 = 문턱(), 방 = G.방향 || 1;
    const 내려감 = (G.상태 === "진행" ? G.t : 0) * 1.5;

    // ── 계단실 ──
    const 벽 = x.createLinearGradient(0, 0, w, 0);
    벽.addColorStop(0, "#2c2f39"); 벽.addColorStop(.5, "#1b1d24"); 벽.addColorStop(1, "#2c2f39");
    x.fillStyle = 벽; x.fillRect(0, 0, w, h);
    x.globalAlpha = .12; x.fillStyle = "#fff4d8"; x.fillRect(250, 0, 140, 10); x.globalAlpha = 1;
    x.fillStyle = "#ffffff09"; x.fillRect(250, 0, 140, 6);

    // 계단 — 내려가면서 위로 흐른다
    for (let i = -1; i < 9; i++) {
      const 오 = (내려감 * 1.1) % 44;
      const y = 96 + i * 44 + 오;
      const 폭 = 120 + (y - 96) * 1.55;
      x.fillStyle = i % 2 ? "#3a3d47" : "#33363f";
      x.fillRect(320 - 폭/2, y, 폭, 30);
      x.fillStyle = "#14161c";
      x.fillRect(320 - 폭/2, y + 30, 폭, 8);
    }
    x.strokeStyle = "#4a4e59"; x.lineWidth = 5;
    x.beginPath(); x.moveTo(96, 120); x.lineTo(-10, h); x.stroke();
    x.beginPath(); x.moveTo(544, 120); x.lineTo(650, h); x.stroke();
    x.strokeStyle = "#2a2d35"; x.lineWidth = 3;
    for (let i = 0; i < 7; i++) {
      const 오 = (내려감 * 1.1) % 52, yy = 130 + i * 52 + 오;
      const dx = (yy - 120) * 0.42;
      x.beginPath(); x.moveTo(96 - dx, yy); x.lineTo(96 - dx, yy + 40); x.stroke();
      x.beginPath(); x.moveTo(544 + dx, yy); x.lineTo(544 + dx, yy + 40); x.stroke();
    }

    // ── 그녀 — 한 계단 아래에서 등을 보이고 내려간다 ──
    const cx = 322, by = 268, 흔 = Math.sin(G.t * .11) * 3;
    x.save(); x.translate(0, 흔);
    x.fillStyle = "#0c0b12";
    x.beginPath();
    x.moveTo(cx-34, by); x.lineTo(cx-30, by-92);
    x.quadraticCurveTo(cx, by-112, cx+30, by-92); x.lineTo(cx+34, by); x.fill();
    x.beginPath(); x.arc(cx, by-136, 24, 0, 7); x.fill();
    x.beginPath(); x.ellipse(cx-2, by-108, 20, 34, .06, 0, 7); x.fill();

    // 휴대폰을 든 팔 — 좌우로 오간다. 보이는 쪽으로 나갔을 때만 화면이 이쪽을 향한다
    const ax = cx + p * 58, ay = by - 74 - Math.abs(p) * 8;
    x.strokeStyle = "#0c0b12"; x.lineWidth = 13; x.lineCap = "round";
    x.beginPath(); x.moveTo(cx + (p > 0 ? 22 : -22), by - 84); x.lineTo(ax, ay); x.stroke();
    x.lineCap = "butt";

    const 밝기 = Math.max(0, v);                    // 반대쪽으로 가면 몸에 가려 안 보인다
    x.save(); x.translate(ax, ay); x.rotate(방 * (-0.18 - Math.abs(p) * 0.5));
    x.fillStyle = "#07060b"; x.fillRect(-11, -19, 22, 38);
    x.fillStyle = "rgba(178,214,255," + (0.12 + 밝기 * 0.8) + ")";
    x.fillRect(-9, -17, 18, 34);
    if (밝기 > .35) {
      x.fillStyle = "rgba(255,255,255," + ((밝기-.35)*0.7) + ")";
      x.fillRect(-6, -12, 12, 3); x.fillRect(-6, -5, 9, 3); x.fillRect(-6, 2, 11, 3);
    }
    x.restore();
    const 번짐 = x.createRadialGradient(ax, ay, 3, ax, ay, 60);
    번짐.addColorStop(0, "rgba(150,200,255," + (0.05 + 밝기*0.2) + ")");
    번짐.addColorStop(1, "rgba(150,200,255,0)");
    x.fillStyle = 번짐; x.beginPath(); x.arc(ax, ay, 60, 0, 7); x.fill();
    x.restore();

    const 어둠 = x.createRadialGradient(320, 190, 70, 320, 190, 300);
    어둠.addColorStop(0, "#00000000"); 어둠.addColorStop(1, "#000000aa");
    x.fillStyle = 어둠; x.fillRect(0, 0, w, h);

    // ── 계기 ──
    // 계기 — 가운데가 몸통, 좌우 끝이 팔을 뻗은 자리. 안전 구간은 매 판 좌우가 바뀐다
    const bw = 260, bx = (w-bw)/2, gy = 288;
    const 위치 = bx + bw * (p + 1) / 2;
    x.fillStyle = "#00000077"; x.fillRect(bx, gy, bw, 12);
    const zs = 방 > 0 ? bx + bw * (문 + 1) / 2 : bx;
    const zw = bw * (1 - 문) / 2;
    x.fillStyle = "#7fc48f44"; x.fillRect(zs, gy, zw, 12);
    x.fillStyle = "#7fc48f";
    x.fillRect(방 > 0 ? zs - 1.5 : zs + zw - 1.5, gy - 3, 3, 18);
    x.fillStyle = "#ffffff1a"; x.fillRect(bx + bw/2 - 1, gy, 2, 12);
    x.fillStyle = v > 문 ? "#7fc48f" : "#8b849b";
    x.fillRect(위치 - 5, gy - 4, 10, 20);
    x.fillStyle = "#8b849b"; x.font = "600 11px system-ui"; x.textAlign = "center";
    x.fillText("보이는 각도", zs + zw/2, gy - 8);

    x.font = "700 14px system-ui";
    for (let i = 0; i < 훔쳐설정.판수; i++) {
      const r = G.로그[i];
      x.fillStyle = !r ? "#3a3548" : r === "봤다" ? "#7fc48f" : "#e8756c";
      x.beginPath(); x.arc(w/2 - 44 + i*22, 30, 6, 0, 7); x.fill();
    }
    x.fillStyle = "#e8ecf2";
    x.fillText(G.성공 + " / " + 훔쳐설정.필요, w/2 + 82, 35);

    <g fill="#161320" stroke="#2c2740" stroke-width="3"><path d="M18 66h84v78H18z"/></g>
    <g stroke="#0c0a14" stroke-width="2" opacity=".75"><line x1="18" y1="104" x2="102" y2="104"/></g>
  </svg>`;

  function 시작(cb) {
    콜백 = cb; 판 = 0; 쓴체력 = 0;
    미니화면(true);
    $("shell").className = "shell on";

      `<div class="spot" data-i="${i}" style="left:${자리[i]}">${상자}</div>`).join("");

  }

  const 칸 = () => [...$("shell").querySelectorAll(".spot")];
  const 잠금 = on => $("shell").classList.toggle("잠금", on);
  const 안내 = (t, s) => $("shellhud").innerHTML = `<b>${t}</b><small>${s}</small>`;

  function 새판() {
    const cfg = 판설정[판];
    정답 = Math.floor(Math.random() * 3);
    잠금(true);
    칸().forEach(el => el.classList.remove("열림"));
    안내(`${판 + 1} / 3`, "잘 봐라");

    // ① 잠깐 뜸을 들이고 ② 확실히 보여주고 ③ 닫고 ④ 섞는다
    setTimeout(() => {
      칸().forEach((el, i) => el.classList.toggle("열림", i === 정답));
      안내(`${판 + 1} / 3`, "여기 있다");
    }, 500);

    setTimeout(() => {
      칸().forEach(el => el.classList.remove("열림"));
      안내(`${판 + 1} / 3`, "섞는다");
    }, 2200);

    setTimeout(() => 섞기(cfg, 0), 2750);
  }

  function 섞기(cfg, k) {
    if (k >= cfg.섞기) {
      잠금(false);
      안내(`${판 + 1} / 3`, "어디에 있나");
      return;
    }
    const a = Math.floor(Math.random() * 3);
    let b = Math.floor(Math.random() * 3);
    while (b === a) b = Math.floor(Math.random() * 3);
    const el = 칸();
    const t = el[a].style.left; el[a].style.left = el[b].style.left; el[b].style.left = t;
    const ia = Number(el[a].dataset.i), ib = Number(el[b].dataset.i);
    el[a].dataset.i = ib; el[b].dataset.i = ia;
    if (정답 === ia) 정답 = ib; else if (정답 === ib) 정답 = ia;
    setTimeout(() => 섞기(cfg, k + 1), cfg.속도);
  }

  function 고름(el) {
    잠금(true);
    자원({ 체력: -7 }); 쓴체력 += 7;
    const 맞음 = Number(el.dataset.i) === 정답;
    칸().forEach(x => x.classList.toggle("열림", Number(x.dataset.i) === 정답));
    안내(`${판 + 1} / 3`, 맞음 ? "있다" : "없다");
    setTimeout(() => {
      if (!맞음) return 끝(false);
      판++;
      if (판 >= 3) return 끝(true);
      새판();

  }

  function 끝(성공) {
    $("shell").className = "shell";
    $("shellhud").className = "shellhud";
    미니화면(false);
    대기 = 콜백;
    if (성공) {
      S.베손찾음 = true;
      자원({ 정신: 26 });

        ["narr","상자 뒤에 그 애가 있었다. 웅크린 채로."],

        ["sys","베손을 찾았다. 정신력이 크게 돌아왔다. (+26)"]]});
    } else {
      자원({ 정신: -9 });
      씬재생({ bg:"alley", 인물:null, 대상:null, 지문:[
        ["narr","상자를 치웠다. 아무것도 없었다."],
        ["narr","분명 거기서 소리가 났는데."],
        ["think","내가 못 본 게 아니다. 옮겨진 것이다."],
        ["think","…옮겨졌다고 말하면, 아무도 안 믿겠지."],
        ["sys",`허탕이었다. 체력 −${쓴체력} · 정신 −9`]]});
    }
  }

  return { 시작, 고름 };
})();

function 이벤트단계() {
  대기 = null;
  if (S.slot >= 슬롯.length) return 하루정산();

  let 후보 = 이벤트들.filter(e =>
    !(e.한번만 && S.소모.includes(e.id)) && (!e.조건 || e.조건(S)));

  if (강제이벤트) {                                           // 강제 지정이 있으면 확률·상한 무시
    const f = 이벤트들.find(x => x.id === 강제이벤트);
    강제이벤트 = null;
    if (f) 후보 = [f]; else console.warn("그런 이벤트 없음:", 강제이벤트);
  } else {
    if (S.오늘이벤트 >= 설정.하루이벤트) return 진행();        // 하루 상한
    if (Math.random() > 설정.이벤트확률 * (0.78 + S.day*0.035)) return 진행();
  }
  S.오늘이벤트++;

  if (!후보.length) return 진행();
  const e = 뽑기(후보);
  if (e.한번만) S.소모.push(e.id);

  $("aff").classList.remove("on");
  대기 = () => {
    자원(e.효과);                                  // 호감도는 건드리지 않는다
    자원팝업(e.효과);
    if (e.획득 && !S.스킬.includes(e.획득)) S.스킬.push(e.획득);
    if (e.미니게임) return MINI[e.미니게임].시작(()=> setTimeout(진행, 400));
    setTimeout(진행, Object.keys(e.효과).length ? 1400 : 300);
  };
  씬재생({ ...e, bg: e.bg, 인물: null, 대상: null });
}

/* 하루 정산 */
function 하루정산() {
  S.slot = 0;

  // 체력은 선택지 잠금과 감쇠 가중으로 이미 대가를 치른다. 별도 벌은 없다.
  if (S.정신 <= 0) return 중얼거림();

  다음날();
}

/* 정신 0 — 그 자리에서 무너진다. 말이 부서지고 하루가 사라진다 */
function 중얼거림() {
  // 가장 확신이 깊은 상대의 문장이 조각나서 새어나온다
  const 최고 = Object.keys(S.호감).reduce((a,b)=> S.호감[a] >= S.호감[b] ? a : b);
  const [가,나,다] = {
    엘리베이터: ["같은 층이었어", "층이 같았다고", "우연이 아니야"],
    횟집:       ["나한테만 말했어", "거기 두지 말라고", "나한테만"],
    소개팅:     ["두 잔이었어", "두 잔을 시켜놨다고", "두 잔이면 그건"],
    듀오:       ["듀오였어", "스쿼드가 아니라", "듀오였다고"],
    귀신:       ["닿으려는 거야", "해치려는 게 아니고", "닿으려는 거지"]
  }[최고];

  const n = (S.중얼횟수 || 0) + 1;
  S.중얼횟수 = n;
  S.정신 = Math.max(8, 32 - n * 8);       // 반복될수록 덜 돌아온다
  S.하루날림 = n >= 2 ? 2 : 1;            // 두 번째부터는 이틀
  S.slot = 0;                             // 남은 시간대는 없다
  HUD(); 오염표시();

  const 괴성 = "으아" + "아".repeat(3 + n * 2) + "—";
  const 토막 = s => s.replace(/\s/g, "").slice(0, Math.max(2, 5 - n));

  const 지문 = [
    ["narr","말이 먼저 나갔다. 생각보다 먼저."],
    ["say",`"${가}. ${나}. ${가}."`],
    ["narr","창밖이 밝았다."],
    ["say",`"${가} ${가} ${다}"`],
    ["say","\"순서가 있는 거야 순서가 순서가 순서\""],
    ["narr","창밖이 붉었다."],
    ["say",`"${괴성}"`],
    ["narr","어디서 들은 소리인지 기억나지 않는다."],
    ["say",`"${토막(가)} ${토막(가)} ${토막(가)} ${가}"`],
    ["narr","창밖이 어두웠다."],
    ["say",`"${나} ${나}"`]
  ];
  if (n >= 2) 지문.splice(7, 0,
    ["say",`"${토막(다)}${토막(다)}${토막(다)}${토막(다)}"`],
    ["narr","목이 아팠다. 언제부터 소리를 냈는지 모르겠다."]);
  if (n >= 3) 지문.push(
    ["say",`"${괴성}"`],
    ["say",`"${토막(가)}${토막(나)}${토막(다)}"`]);

  지문.push(
    ["narr","누가 왔다 간 것도 같고 아닌 것도 같다."],
    ["narr","무슨 말을 했는지는 기억나지 않는다."],
    ["narr", n === 1
      ? "방의 색이 조금 바랬다. 원래 그랬던 것 같기도 하다."
      : "방이 또 한 겹 어두워졌다. 이번에는 원래 그랬다고 생각되지 않았다."]);

  // 세 번째는 돌아오지 못한다. 남은 날들이 통째로 지나간다.
  if (n >= 3) {
    S.조기종료 = true;
    지문.push(
      ["narr","그 다음은 기억나지 않는다."],
      ["narr","창밖이 밝았다가 어두웠다가 다시 밝았다."],
      ["narr","몇 번인지는 세지 못했다."],
      ["sys","정신을 차렸을 때 일주일은 이미 지나 있었다."]);
    대기 = 최종선택;
  } else {
    지문.push(["sys", n >= 2 ? `${n}번째다. 이틀이 사라졌다.` : "하루가 통째로 사라졌다."]);
    대기 = 다음날;
  }

  return 씬재생({ bg:"night", 인물:null, 대상:null, 지문 });
}

function 다음날() {
  대기 = null;
  S.day++; S.오늘이벤트 = 0;
  if (S.day > 설정.총일수) return 최종선택();

  // 체력은 하루치 행동력. 아침이면 완전히 돌아온다. 정신은 돌아오지 않는다.
  const 전체력 = S.체력;
  S.체력 = 설정.최대체력;
  const 회복량 = S.체력 - 전체력;

  // 감쇠 — 근거 없는 확신은 하룻밤 사이에 새어나간다.
  // 비율이라 높이 쌓을수록 많이 잃고, 지쳐서 잠들수록 더 많이 잃는다.
  const 지침 = 1 - 전체력 / 설정.최대체력;
  const 감쇠율 = 설정.감쇠최소 + (설정.감쇠최대 - 설정.감쇠최소) * 지침;

  const 샌것 = [];
  Object.keys(S.호감).forEach(k => {
    if (S.확정[k]) return;                    // 굳은 확신은 새어나가지 않는다
    if (S.호감[k] <= 0) return;
    const 전 = S.호감[k];
    S.호감[k] = Math.max(0, 전 - Math.round(전 * 감쇠율));
    if (전 !== S.호감[k]) 샌것.push(
      `<span class="n">${그녀들[k].이름}</span>` +
      `<span class="v">${S.호감[k]}%</span>` +
      `<span class="d">−${전 - S.호감[k]}</span>`);
  });

  const 줄 = [];
  if (S.day === 설정.총일수) 줄.push(`<div class="last">마지막 날</div>`);
  if (회복량 > 0) 줄.push(`<div class="body">몸은 돌아왔다 · 체력 ${설정.최대체력}</div>`);
  if (샌것.length) {
    const 평 = 지침 > .7 ? "지쳐서 잠든 만큼 많이 샜다" : 지침 < .3 ? "몸이 성한 밤은 덜 샌다" : "";
    if (줄.length) 줄.push(`<div class="rule"></div>`);
    줄.push(`<div class="leadin">어젯밤 새어나간 확신</div>`);
    줄.push(`<div class="rate">−${Math.round(감쇠율*100)}%</div>`);
    if (평) 줄.push(`<div class="note">${평}</div>`);
    줄.push(`<div class="rows">${샌것.join("")}</div>`);
  }
  const 부제 = 줄.length ? `<div class="day">${줄.join("")}</div>` : "";

  // 중얼거리다 날린 날은 통째로 지나간다
  if (S.하루날림 > 0) {
    S.하루날림--;
    HUD();
    return 카드(`${S.day}일차`,
      `<div class="day"><div class="skip">중얼거리는 동안 하루가 지나갔다.` +
      `<small>아무도 만나지 못했다.</small></div></div>`,
      ()=> 다음날());
  }

  카드(`${S.day}일차`, 부제, ()=>{ HUD(); 진행(); });
}

/* 카드 연출 */
function 카드(제목, 부제, cb) {
  const v = $("veil");
  v.innerHTML = `<div class="card"><b>${제목}</b><div class="sub">${부제}</div></div>`;
  v.classList.add("on");
  // 읽을 것이 많은 날은 더 오래 머문다
  const 줄수 = (부제.match(/<div class="rows"/) ? (부제.match(/class="n"/g) || []).length : 0);
  const 머묾 = !부제 ? 1500 : 2400 + 줄수 * 320;
  setTimeout(()=>{ if (cb) { v.classList.remove("on"); setTimeout(cb, 500); } }, 머묾);
}

    : `<div class="card"><b>일주일이 지났다</b>

  setTimeout(()=>{
    const 가능 = Object.keys(그녀들).filter(k => S.호감[k] >= 100);

    v.innerHTML = `<div class="card" style="justify-content:flex-start;padding-top:7%">

        : `<button class="lock" disabled>${그녀들[k].이름}<small>${S.호감[k]}% · 아직 확신이 없다</small></button>`;
    }).join("");
  }, 1800);
}

/* ── 엔딩 해금 기록 ──
   브라우저에 남는 유일한 값. 진행 상황은 저장하지 않는다. */
const 기록키 = "면제_엔딩_v1";
function 본엔딩() {
  try { return JSON.parse(localStorage.getItem(기록키)) || []; }
  catch (e) { return []; }                       // 사생활 보호 모드 등
}
function 엔딩기록(n) {
  try {
    const l = 본엔딩();
    if (l.includes(n)) return false;
    l.push(n); localStorage.setItem(기록키, JSON.stringify(l));
    return true;                                  // 처음 본 엔딩
  } catch (e) { return false; }
}

/* 엔딩 번호 — HAPPY 1~5, BAD 6~10, 아무도 11 */
const 엔딩번호 = { 엘리베이터:1, 횟집:2, 소개팅:3, 듀오:4, 귀신:5, 아무도:11 };
const 총엔딩 = 11;
const 엔딩표 = (키, 해피) => {
  const n = 키 === "아무도" ? 11 : 엔딩번호[키] + (해피 ? 0 : 5);
  const 처음 = 엔딩기록(n);
  return `<div class="endtag ${해피 ? "happy" : "bad"}">${해피 ? "HAPPY" : "BAD"} ENDING` +
    `<span class="endno">${n} / ${총엔딩}</span>` +
    (처음 ? `<span class="새엔딩">NEW</span>` : "") + `</div>`;
};

/* 미니게임 직전 — 일주일 내내 올려온 그 숫자를 마지막으로 한 번 보여준다.
   가짜라는 걸 게임은 이미 아는데, 가장 성대하게 울린다. */
function 마지막연출(키, 다음) {
  const f = $("finale");
  $("fnWho").className = "who"; $("fnLab").className = "lab";
  $("fnTrack").className = "track"; $("fnFill").className = "fill";
  $("fnPct").className = "pct"; $("fnSay").className = "say"; $("fnOnce").className = "once";
  $("fnWho").textContent = 그녀들[키].이름;
  $("fnSay").textContent = "“" + (최종설정[키].각오 || "") + "”";
  $("fnPct").textContent = "0%";
  $("fnFill").style.width = "0%";
  f.classList.add("on");

  setTimeout(() => $("fnWho").className = "who 보임", 250);
  setTimeout(() => { $("fnLab").className = "lab 보임"; $("fnTrack").className = "track 보임"; }, 650);

  /* 게이지와 숫자를 같은 프레임에서 몰아야 100%에 정확히 같이 닿는다 */
  setTimeout(() => {
    $("fnPct").className = "pct 보임";
    const 시작 = performance.now(), 길이 = 1400;
    (function 차오름(now) {
      const p = Math.min(1, (now - 시작) / 길이);
      const e = 1 - Math.pow(1 - p, 3);
      $("fnFill").style.width = (e * 100) + "%";
      $("fnPct").textContent = Math.round(e * 100) + "%";
      if (p < 1) return requestAnimationFrame(차오름);
      $("fnFill").style.width = "100%";
      $("fnPct").textContent = "100%";
      $("fnPct").className = "pct 보임 가득";
      $("fnFill").className = "fill 가득";
      $("fnTrack").className = "track 보임 가득";
    })(시작);
  }, 900);

  /* 2300 — 100%가 다 찼다. 여기서 1.2초 동안 그것만 보여준다 */
  setTimeout(() => $("fnSay").className = "say 보임", 3500);
  setTimeout(() => $("fnOnce").className = "once 보임", 4450);
  setTimeout(() => {
    f.classList.remove("on");
    setTimeout(다음, 450);
  }, 5750);
}

function 수집그리기() {
  const 본 = 본엔딩();
  const 칸 = [];
  for (let n = 1; n <= 총엔딩; n++) {
    const 있 = 본.includes(n);
    const bad = n >= 6 && n <= 10;
    const 라벨 = n === 11 ? "아무도" : (bad ? "BAD" : "HAPPY");
    칸.push(`<div class="cell${있 ? " got" : ""}${bad || n === 11 ? " bad" : ""}">` +
      `<span class="num">${String(n).padStart(2, "0")}</span>` +
      (있 ? `${라벨}<br>${엔딩이름[n]}` : "?") + `</div>`);
  }
  $("coll").innerHTML =
    `<div class="head">엔딩 <b>${본.length} / ${총엔딩}</b></div>` +
    `<div class="grid">${칸.join("")}</div>` +
    (본.length ? `<div class="reset"><button onclick="기록지우기()">기록 지우기</button></div>` : "");
}

function 기록지우기() {

  try { localStorage.removeItem(기록키); } catch (e) {}
  수집그리기();
}

      $("veil").innerHTML = `<div class="card">
        <b style="color:${성공 ? "#82c795" : "#e8756c"}">${성공 ? "무사히 놓았다" : "쏟았다"}</b>
        <div class="sub">불안정 ${균형설정.불안정} · 조작 ${균형설정.조작} · 한계 ${균형설정.한계}도</div>
        <button style="margin-top:16px;padding:14px 30px;font-size:18px;border-radius:10px;
          background:#241a28;color:#eee;border:1px solid #ffffff33;cursor:pointer"
          onclick="location.reload()">다시</button></div>`;
    });
  }

  if (h === "가위") {
    강제이벤트 = null;
    배경("night", "테스트");
    return MINI.가위눌림.시작(버팀 => {
      $("veil").classList.add("on");
      $("veil").innerHTML = `<div class="card">
        <b style="color:${버팀 ? "#82c795" : "#e8756c"}">${버팀 ? "손을 놓았다 — 이어짐" : "빠져나왔다 — 이어지지 못함"}</b>
        <div class="sub">버티기 ${가위설정.제한/1000}초 · 한 번당 ${가위설정.한번} · 감소 ${가위설정.감소}/프레임</div>
        <button style="margin-top:16px;padding:14px 30px;font-size:18px;border-radius:10px;
          background:#241a28;color:#eee;border:1px solid #ffffff33;cursor:pointer"
          onclick="location.reload()">다시</button></div>`;
    });
  }

  if (h === "사격") {
    강제이벤트 = null;
    배경("game", "테스트");
    const 반복 = () => MINI.사격.시작((성공, 처치) => {
      $("veil").classList.add("on");
      $("veil").innerHTML = `<div class="card">
        <b style="color:${성공 ? "#82c795" : "#e8756c"}">${성공 ? "제압 완료" : "실패"}</b>
        <div class="sub">${처치} / ${사격설정.적수} 명 · 탄창 ${사격설정.탄창}발 · 간격 ${사격설정.간격}ms</div>
        <button style="margin-top:16px;padding:14px 30px;font-size:18px;border-radius:10px;
          background:#241a28;color:#eee;border:1px solid #ffffff33;cursor:pointer"
          onclick="location.reload()">다시</button></div>`;
    });
    return 반복();
  }

  if (h && h.startsWith("최종")) {
    const 키 = h.split("_")[1];
    강제이벤트 = null;
    Object.keys(그녀들).forEach(k => {
      if (!키 || k === 키) { S.호감[k] = 100; S.확정[k] = true; }
      else S.호감[k] = 40 + Math.floor(Math.random() * 45);
    });
    S.day = 설정.총일수; HUD();
    return 최종선택();
  }

  타이틀();
})();
</script>
</body>
</html>
